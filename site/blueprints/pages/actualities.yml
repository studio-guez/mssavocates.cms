title: Actualités

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeSort: true
  changeTemplate: false
  changeSlug: true
  delete: true
  changeStatus: true

num: default

sections:
  articles:
    label: Liste des articles
    type: pages
    template: article
    sortBy: date desc
    sortable: true
    info: "{{ page.date.toDate('d/m/Y') }}"
    columns:
      main_title:
        label: Titre
        type: text
        value: "{{ page.main_title }}"
        width: 1/3
      date:
        label: Date
        type: text
        value: "{{ page.date.toDate('d/m/Y') }}"
        width: 1/6
      hero:
        label: Hero
        type: text
        value: "{{ page.showInHero }}"
        width: 1/12
      carousel:
        label: Carousel
        type: text
        value: "{{ page.showInCarousel }}"
        width: 1/12
      status:
        label: Statut
        type: text
        value: "{{ page.status }}"
        width: 1/6
