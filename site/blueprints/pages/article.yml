title: Article

status:
  draft:
    label: Brouillon
    text: L'article est en mode brouillon. Il ne peut être vu que par les éditeurs avec accès au Panel.
  listed:
    label: Publié
    text: L'article est en ligne et visible sur le site

tabs:
  content:
    label: Contenu de l’article
    icon: edit
    fields:

      main_title:
        label: Titre principal
        type: text
        width: 2/3

      date:
        label: Date
        type: date
        width: 1/3
        default: today

      accroche:
        label: Titre secondaire
        type: text

      show_in_hero:
        label: Afficher dans le hero de la page d'accueil
        type: toggle
        text:
          - Non
          - Oui
        width: 1/2
        help: Maximum 2 articles peuvent être affichés dans le hero

      show_in_carousel:
        label: Afficher dans le carrousel de la page d'accueil
        type: toggle
        text:
          - Non
          - Oui
        width: 1/2
        help: Maximum 5 articles peuvent être affichés dans le carrousel

      image:
        label: Image de couverture
        type: files
        multiple: false
        uploads: image

      resume:
        label: Résumé
        type: writer
        size: medium
        inline: true
        marks:
          - bold
          - italic
          - link
        nodes:
          - paragraph

      contenu:
        label: Contenu de l'article
        type: blocks
        fieldsets:
          - heading
          - text
          - image
          - list
