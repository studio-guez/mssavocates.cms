title: Page de contact

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeSort: false
  changeTemplate: false
  changeSlug: true
  delete: false
  changeStatus: false

num: default

tabs:
  content:
    label: Contenu
    fields:

      # 🧾 Intro
      intro_headline:
        label: 🧾 Introduction
        type: headline
        numbered: false

      intro:
        label: Introduction
        type: text
 
      # 🏢 Coordonnées de l'étude
      etude_headline:
        label: 🏢 Coordonnées de l’étude
        type: headline
        numbered: false

      etude_nom:
        label: Nom de l’étude
        type: text

      etude_email:
        label: Email de l’étude
        type: email

      etude_tel:
        label: Téléphone
        type: tel

      # 🗺️ Adresse + image
      adresse_headline:
        label: 🗺️ Adresse & image
        type: headline
        numbered: false

      adresse:
        label: Adresse postale
        type: writer

      image:
        label: Image illustrative (carte ou photo)
        type: files
        multiple: false
        layout: cards
        uploads:
          template: image
