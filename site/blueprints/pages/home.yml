title: Accueil

status:
  draft:
    label: Draft
    text: The article is not still in draft mode. It can only be seen by editors with Panel access.
  listed:
    label: Published
    text: The article is online and listed in the blog

options:
  changeSort: false
  changeTemplate: false
  changeSlug: false
  delete: false
  changeStatus: false


tabs:
  content:
    label: Contenu
    fields:

      # Hero
      hero_headline:
        label: 🟣 HERO
        type: headline
        numbered: false

      introduction:
        label: Introduction
        type: structure
        fields:
          titre:
            label: Titre principal
            type: text
            default: UNE APPROCHE HUMAINE, UNE ÉTUDE ENGAGÉE PROUT

          texte:
            label: Texte d’introduction
            type: text
            nodes:
              - paragraph
            marks:
              - bold
              - link
            size: medium

      # Photo d'équipe
      image_headline:
        label: 🟦 Photo d'équipe
        type: headline
        numbered: false

      photo_equipe:
        label: Photo de l'équipe
        type: files
        multiple: false
        layout: cards
        uploads:
          template: image

      # Domaines
      domaines_headline:
        label: 📘 Domaines d’activités
        type: headline
        numbered: false

      domaines_activite:
        label: Domaines d’activités
        type: structure
        fields:
          domaines:
            label: Liste des domaines
            type: structure
            fields:
              titre:
                label: Titre du domaine
                type: text
              description:
                label: Description
                type: writer
                nodes:
                  - paragraph
                marks:
                  - bold
                  - link

          image:
            label: Image illustrative 
            type: files
            multiple: false
            layout: cards
            uploads:
              template: image

# Footer
      footer_headline:
        label: Pied de page
        type: headline
        numbered: false

      adresse:
        label: Adresse
        type: writer
        nodes: false
        marks: [bold]
        width: 1/2

      acces:
        label: Accès
        type: writer
        nodes: false
        marks: [bold]
        width: 1/2

      contact:
        label: Contact
        type: writer
        nodes: false
        marks: [bold]
        width: 1/2

      accueil_telephonique:
        label: Accueil téléphonique
        type: writer
        nodes: false
        marks: [bold]
        width: 1/2