title: Accueil

status:
  draft:
    label: Brouillon
    text: La page est en mode brouillon. Elle ne peut être vue que par les éditeurs avec accès au Panel.
  listed:
    label: Publiée
    text: La page est en ligne et visible sur le site

options:
  changeSort: false
  changeTemplate: false
  changeSlug: false
  delete: false
  changeStatus: false


tabs:
  content:
    label: Contenu
    fields:

      # Hero
      hero_headline:
        label: 🟣 HERO
        type: headline
        numbered: false

      introduction:
        label: Introduction
        type: structure
        min: 1
        max: 1
        fields:
          titre:
            label: Titre principal
            type: text
            default: UNE APPROCHE HUMAINE, UNE ÉTUDE ENGAGÉE PROUT

          texte:
            label: Texte d'introduction
            type: text
            nodes:
              - paragraph
            marks:
              - bold
              - link
            size: medium

      # Photo d'équipe
      image_headline:
        label: 🟦 Photo d'équipe
        type: headline
        numbered: false

      photo_equipe:
        label: Photo de l'équipe
        type: files
        multiple: false
        layout: cards
        uploads:
          template: image

      # Domaines
      domaines_headline:
        label: 📘 Notre étude
        type: headline
        numbered: false

      domaines_titre:
        label: Titre de la section
        type: text
        default: Domaines d'activités

      domaines_activite_gauche:
        label: Colonne de gauche
        type: blocks
        fieldsets:
          - soustitre
          - text
          - list
          - image
        pretty: true
        width: 1/2

      domaines_activite_droite:
        label: Colonne de droite
        type: blocks
        fieldsets:
          - soustitre
          - text
          - list
          - image
        pretty: true
        width: 1/2