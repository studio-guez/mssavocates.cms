title: Accueil

status:
  draft:
    label: Draft
    text: The article is not still in draft mode. It can only be seen by editors with Panel access.
  listed:
    label: Published
    text: The article is online and listed in the blog

options:
  changeSort: false
  changeTemplate: false
  changeSlug: false
  delete: false
  changeStatus: false


tabs:
  content:
    label: Contenu
    fields:

      # Hero
      hero_headline:
        label: 🟣 HERO
        type: headline
        numbered: false

      introduction:
        label: Introduction
        type: structure
        fields:
          titre:
            label: Titre principal
            type: text
            default: UNE APPROCHE HUMAINE, UNE ÉTUDE ENGAGÉE PROUT

          texte:
            label: Texte d’introduction
            type: text
            nodes:
              - paragraph
            marks:
              - bold
              - link
            size: medium

      # Photo d'équipe
      image_headline:
        label: 🟦 Photo d'équipe
        type: headline
        numbered: false

      photo_equipe:
        label: Photo de l'équipe
        type: files
        multiple: false
        layout: cards
        uploads:
          template: image

      # Équipe
      equipe_headline:
        label: 👥 Équipe
        type: headline
        numbered: false

      equipe:
        label: Membres
        type: structure
        fields:
          prenom:
            label: Prénom
            type: text
          nom:
            label: Nom
            type: text
          image:
            label: Photo
            type: files
            multiple: false
          lien:
            label: Lien vers la page membre
            type: pages
            multiple: false
            query: site.find("equipe").children

      # Domaines
      domaines_headline:
        label: 📘 Domaines d’activités
        type: headline
        numbered: false

      domaines_activite:
        label: Domaines d’activités
        type: structure
        fields:
          domaines:
            label: Liste des domaines
            type: structure
            fields:
              titre:
                label: Titre du domaine
                type: text
              description:
                label: Description
                type: writer
                nodes:
                  - paragraph
                marks:
                  - bold
                  - link

          image:
            label: Image illustrative 
            type: files
            multiple: false
            layout: cards
            uploads:
              template: image
